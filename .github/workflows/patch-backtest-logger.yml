name: Patch backtest logger

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/add_backtest_logger.py'
      - '.github/workflows/patch-backtest-logger.yml'

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch notebook
        run: python tools/add_backtest_logger.py

      - name: Commit notebook change
        shell: bash
        run: |
          if git diff --quiet -- Grid_trading.ipynb; then
            echo 'No notebook change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Grid_trading.ipynb
          git commit -m 'Add automatic GitHub backtest logging'
          git push
